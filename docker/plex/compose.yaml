services:
  plex:
    image: plexinc/pms-docker:latest
    container_name: plex
    network_mode: host
    restart: unless-stopped
    environment:
      - TZ=America/New_York
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - ./config:/config
      - ./transcode:/transcode
      - /mnt/media:/data:ro
